name: Release

# Cuts a GitHub Release for a "done" version. MANUAL trigger only
# (workflow_dispatch) so it never runs on ordinary pushes - ci.yml stays the
# push-to-main backstop; this is the deliberate "ship it" button.
#
# The release notes live in internal_only/release notes/ which is GITIGNORED, so
# a fresh runner checkout does not contain them. They are handed to this run as
# the `notes` input at trigger time (see scripts/release.ps1, which reads the
# local notes file and passes its contents). The notes never enter the repo.
#
# What it does on a clean Windows runner:
#   1. Build the app (npm run tauri build) -> the MSI installer.
#   2. Title  = vX.X.X, read from src-tauri/tauri.conf.json (single source of truth).
#   3. Body   = the `notes` input.
#   4. Assets = the built MSI and its SHA-256 checksum file.
#   5. A signed GitHub build attestation saying this exact MSI was built here,
#      by this workflow, from this commit (checked with `gh attestation verify`).
# The release is created as a DRAFT for review; you publish it by hand.
#
# Assumes the target commit already passed validation (local scripts/ci.ps1 and
# the ci.yml backstop on main). This workflow builds and publishes; it does not
# re-run the test/audit suite.

on:
  workflow_dispatch:
    inputs:
      notes:
        description: "Release notes markdown (body of the release). Passed by scripts/release.ps1 from the local gitignored notes file."
        required: true
        type: string

permissions:
  contents: write
  # The build attestation: id-token mints the short-lived signing certificate,
  # attestations stores the attestation, artifact-metadata its storage record.
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    name: Build MSI and draft release
    runs-on: windows-latest
    env:
      # The `secrets` context is not available in a step-level `if`, so the
      # "is signing configured?" question is answered once here (job-level env
      # CAN read secrets) and the steps below branch on this instead.
      SIGNING_CONFIGURED: ${{ secrets.AZURE_CLIENT_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: npm ci
        run: npm ci

      - name: Build app (MSI)
        run: npm run tauri build

      - name: Resolve version and locate MSI
        id: pkg
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          $msi = Get-ChildItem "src-tauri/target/release/bundle/msi/*.msi" | Select-Object -First 1
          if (-not $msi) { throw "No MSI found under src-tauri/target/release/bundle/msi/" }
          "tag=$tag"            >> $env:GITHUB_OUTPUT
          "msi=$($msi.FullName)" >> $env:GITHUB_OUTPUT
          Write-Host "Release $tag  ->  $($msi.Name)"

      # Authenticode signing via Azure Trusted Signing (now "Azure Artifact
      # Signing"). Windows Defender quarantined an unsigned build as
      # Trojan:Win32/Bearfoos.A!ml, the textbook false positive for a new,
      # unsigned, low-prevalence binary that spawns PTYs. Signing is the actual
      # fix; a signed identity accrues reputation and stops most ML heuristics.
      #
      # SKIPPED, not failed, when the secrets aren't configured, so the release
      # workflow keeps working until the Azure side is set up. See
      # internal_only/docs/code-signing.md for what to configure.
      - name: Sign the MSI
        id: sign
        if: env.SIGNING_CONFIGURED == 'true'
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE }}
          files-folder: src-tauri/target/release/bundle/msi
          files-folder-filter: msi
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Warn when the build is unsigned
        if: env.SIGNING_CONFIGURED != 'true'
        shell: pwsh
        run: |
          Write-Host "::warning::Signing secrets are not configured, so this MSI is UNSIGNED." `
            "Windows will show 'Publisher: Unknown' and Defender may flag it." `
            "See internal_only/docs/code-signing.md."

      # Published in the release notes so anyone can verify a download, and so a
      # Defender false-positive report can reference an exact artifact.
      - name: Hash the MSI
        id: hash
        shell: pwsh
        run: |
          $msi = "${{ steps.pkg.outputs.msi }}"
          $h = (Get-FileHash $msi -Algorithm SHA256).Hash.ToLower()
          # Also as a file beside the MSI, in the usual "<hash>  <name>" form,
          # so a script can fetch the checksum without reading the page.
          $sumFile = "$msi.sha256"
          [IO.File]::WriteAllText($sumFile, "$h  $(Split-Path $msi -Leaf)`n")
          "sha256=$h"         >> $env:GITHUB_OUTPUT
          "sumfile=$sumFile"  >> $env:GITHUB_OUTPUT
          Write-Host "SHA-256  $h"

      # Proves where the MSI came from, which a checksum cannot: a signed record
      # (Sigstore, keyless) that this exact file was built by this repository's
      # release workflow from this commit. Runs after signing, so it covers the
      # file that is published.
      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.pkg.outputs.msi }}

      - name: Write notes file
        shell: pwsh
        env:
          RELEASE_NOTES: ${{ inputs.notes }}
          MSI_NAME: ${{ steps.pkg.outputs.msi }}
          MSI_SHA256: ${{ steps.hash.outputs.sha256 }}
        run: |
          # Via env (not string interpolation) so nothing in the notes can inject
          # into the script. UTF-8 without BOM keeps the header emoji intact.
          $env:RELEASE_NOTES | Out-File -FilePath notes.md -Encoding utf8 -NoNewline
          # Append the checksum so a download can be verified independently.
          $name = Split-Path $env:MSI_NAME -Leaf
          $block = "`n`n---`n`n**Verify your download**`n`n" +
                   "``````text`n$name`nSHA-256  $env:MSI_SHA256`n```````n`n" +
                   "In PowerShell: ``Get-FileHash .\$name`` (the same hash is in ``$name.sha256``).`n`n" +
                   "To confirm it was built from this repository by its release workflow, " +
                   "with the [GitHub CLI](https://cli.github.com/):`n`n" +
                   "``````text`ngh attestation verify $name --repo ${{ github.repository }}`n```````n`n" +
                   "These show the file is intact and where it was built. On their own they are not a " +
                   "Windows code signature."
          Add-Content -Path notes.md -Value $block -Encoding utf8

      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.pkg.outputs.tag }}"
          if (gh release view $tag 2>$null) {
            throw "Release $tag already exists. Delete the existing (draft) release or bump the version, then re-run."
          }
          gh release create $tag `
            --draft `
            --title $tag `
            --notes-file notes.md `
            --target $env:GITHUB_SHA `
            "${{ steps.pkg.outputs.msi }}" `
            "${{ steps.hash.outputs.sumfile }}"
          Write-Host "Draft release $tag created. Review it on the Releases page, then Publish."
