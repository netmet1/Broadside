name: CI

# While the repo is PRIVATE, PR validation runs locally via scripts/ci.ps1
# (decision D-060) to save Windows-runner minutes and keep the loop fast.
# This workflow stays as a clean-room backstop on every push to main, plus an
# on-demand run via the Actions "Run workflow" button (workflow_dispatch).
# AT PUBLIC FLIP: restore the `pull_request: branches: [main]` trigger and
# enable branch protection with required checks (D-021/D-023).
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  rust:
    name: Rust (build, test, audit)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: cargo build
        run: cargo build --locked --all-targets

      - name: cargo test
        run: cargo test --locked --all-targets

      - name: Install cargo-audit & cargo-deny
        run: |
          cargo install cargo-audit --locked
          cargo install cargo-deny --locked

      - name: cargo audit
        run: cargo audit

      - name: cargo deny check
        run: cargo deny check

  frontend:
    name: Frontend (build, lint, audit)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: npm ci
        run: npm ci

      - name: typecheck
        run: npm run typecheck

      - name: lint
        run: npm run lint

      - name: build
        run: npm run build

      - name: npm audit
        run: npm audit --audit-level=high
