# cargo-deny configuration. Permissive in alpha; tighten at beta when we audit
# the dependency tree against the security baseline.

[graph]
all-features = false

[advisories]
# v2 schema. Vulnerabilities and yanked crates still fail.
# `unmaintained = "workspace"` is a scope filter — only flag unmaintained
# crates in our direct workspace deps, not the transitive tree. Tauri 2
# pulls in noisy unmaintained transitives (GTK3 bindings, unic-* helpers)
# that are real ecosystem problems but not actionable here.
# Real CVE detection is also covered by `cargo audit` as a separate CI step.
version = 2
yanked = "warn"
unmaintained = "workspace"
ignore = [
    # Marvin Attack timing side channel in the `rsa` crate (no fixed release
    # exists). Pulled in by russh's `rsa` feature for RSA public-key auth.
    # Exploitation requires an attacker to time many RSA private-key
    # operations — a server-under-load scenario, not a desktop SSH client
    # making occasional auth signatures. Mirror of src-tauri/.cargo/audit.toml;
    # revisit at beta hardening or when rsa ships a constant-time fix (D-037).
    "RUSTSEC-2023-0071",
]

[licenses]
version = 2
# Skip license checking for our own workspace crate (it's `publish = false`
# and proprietary; cf. NOTICE.md). cargo-deny still checks third-party deps.
private = { ignore = true }
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "Zlib",
    "MPL-2.0",
    "BSL-1.0",
    "0BSD",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "allow"
wildcards = "warn"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
