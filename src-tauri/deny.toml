# cargo-deny configuration. Permissive in alpha; tighten at beta when we audit
# the dependency tree against the security baseline.

[graph]
all-features = false

[advisories]
# v2 schema: unmaintained/unsound/notice are treated as informational rather
# than hard errors. Vulnerabilities and yanked crates still fail. Real CVE
# detection is also covered by `cargo audit` as a separate CI step.
version = 2
yanked = "warn"

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "Zlib",
    "MPL-2.0",
    "BSL-1.0",
    "0BSD",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "allow"
wildcards = "warn"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
