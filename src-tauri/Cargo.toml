[package]
name = "broadside"
version = "1.2.0"
description = "Windows desktop SSH broadcast console"
authors = ["netmet1"]
license = "GPL-3.0-only"
# `publish = false` keeps this off crates.io; the SPDX license above is the
# authoritative expression, mirrored by the top-level LICENSE file and NOTICE.md.
publish = false
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "broadside_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
# Enables the paid-tier build path. No-op in v0.1a alpha.
commercial = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
keyring = { version = "3", features = ["windows-native"] }
age = "0.11"
# default-features off to swap aws-lc-rs (needs CMake/NASM on Windows) for ring
russh = { version = "0.61", default-features = false, features = ["flate2", "ring", "rsa"] }
# SFTP subsystem client (russh itself has no file transfer). Stream-agnostic —
# wraps russh's ChannelStream; independent of russh's version.
russh-sftp = "2"
tokio = { version = "1", features = ["time", "sync", "net", "io-util", "fs"] }
base64 = "0.22"
sysinfo = "0.39.3"
csv = "1.4.0"
calamine = "0.36.0"
# Hosts export to .xlsx (D-058). Pure-Rust, no C deps; mirrors the CSV columns.
rust_xlsxwriter = "0.95.0"
# MultiTerminal VT stream interpreter (D-061): turns raw PTY bytes into
# completion-delimited command blocks + TUI detection. Alacritty's parser core
# (chosen over alacritty_terminal for its small, stable API). Pure-Rust, MIT/Apache.
vte = "0.13"
# Skill expect/send patterns (skills-feature-plan Phase 1): user-authored
# regexes matched against the ANSI-stripped PTY view, plus the engine's own
# completion sentinel. Pure-Rust, no C deps; linear-time matching means a
# user-authored pattern can't catastrophically backtrack a run.
regex = "1"
argon2 = "0.5.3"
portable-pty = "0.9.0"
# Local-side deletes go to the Recycle Bin (recoverable) rather than std::fs
# permanent removal. Pure-Rust Windows shell bindings, no C deps.
trash = "5"

[dev-dependencies]
tempfile = "3"
# test-util powers the skill engine's paused-clock tests: timeouts and settle
# windows resolve instantly and deterministically instead of sleeping.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net", "test-util"] }
zip = { version = "8.6.0", default-features = false }
