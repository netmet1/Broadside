[package]
name = "omniterminal"
version = "0.1.0-alpha.0"
description = "Windows desktop SSH broadcast console"
authors = ["netmet1"]
# No `license` field by design. NOTICE.md is the authoritative statement.
# Combined with `publish = false`, Cargo never asks for an SPDX expression.
publish = false
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "omniterminal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
# Enables the paid-tier build path. No-op in v0.1a alpha.
commercial = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
keyring = { version = "3", features = ["windows-native"] }
age = "0.11"
# default-features off to swap aws-lc-rs (needs CMake/NASM on Windows) for ring
russh = { version = "0.61", default-features = false, features = ["flate2", "ring", "rsa"] }
tokio = { version = "1", features = ["time", "sync", "net"] }
base64 = "0.22"
sysinfo = "0.39.3"
csv = "1.4.0"
calamine = "0.35.0"
# Hosts export to .xlsx (D-058). Pure-Rust, no C deps; mirrors the CSV columns.
rust_xlsxwriter = "0.95.0"
# OmniTerminal VT stream interpreter (D-061): turns raw PTY bytes into
# completion-delimited command blocks + TUI detection. Alacritty's parser core
# (chosen over alacritty_terminal for its small, stable API). Pure-Rust, MIT/Apache.
vte = "0.13"
argon2 = "0.5.3"
portable-pty = "0.9.0"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net"] }
zip = { version = "8.6.0", default-features = false }
